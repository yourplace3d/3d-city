name: Promo video

# Renders the promo videos (9:16 and 16:9) from live map data with tools/video/render.mjs and attaches
# them to a draft release, which only people with write access can see. Start it from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      scenes:
        description: 'Optional: other places, as JSON [{"place":"…","hash":"lat=…&lon=…&km=2&ex=1.5","lines":["line 1","line 2"]}]'
        required: false
        default: ''
      end:
        description: 'Optional: the end card text, as JSON {"what":"…","free":"…"}'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  render:
    name: Render
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Build the app
        run: npm ci && npm run build

      - name: Install ffmpeg and a browser
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm i --no-save --no-audit --no-fund playwright@1.64.1 && npx playwright install --with-deps chromium

      - name: Render
        env:
          VIDEO_SCENES: ${{ inputs.scenes }}
          VIDEO_END: ${{ inputs.end }}
        run: node tools/video/render.mjs

      - name: Keep the files with this run
        uses: actions/upload-artifact@v4
        with:
          name: promo-video
          path: video-out/*

      - name: Draft release with the videos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "promo-$(date -u +%Y%m%d-%H%M)" video-out/* --draft \
            --title "Promo video (draft: only visible to you)" \
            --notes "Rendered from live map data by the Promo video workflow. Download the MP4s; delete this draft when you're done."
