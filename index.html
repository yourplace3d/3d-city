<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Your Place · 3D city model of any address, free STL export</title>
    <meta name="description" content="Type any address and see the area around it as a 3D model with real terrain and building heights. Free, no sign-up. Save a poster or an STL to 3D print." />
    <link rel="canonical" href="%SITE_URL%" />
    <meta name="theme-color" content="#ebe7df" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1b19" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Your Place" />
    <meta property="og:title" content="Your Place · the places that matter to you, in 3D" />
    <meta property="og:description" content="The street you grew up on, where you met, the town you left: type the address and get it as a 3D model with real terrain and buildings. Free. Share it, save a poster or 3D print it." />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A 3D model of a city on its real terrain, made with Your Place" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Your Place · the places that matter to you, in 3D" />
    <meta name="twitter:description" content="The street you grew up on, where you met, the town you left: type the address and get it as a 3D model. Free, works on your phone." />
    <meta name="twitter:image" content="%SITE_URL%og.jpg" />
    <meta name="twitter:image:alt" content="A 3D model of a city on its real terrain, made with Your Place" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Your Place",
        "url": "%SITE_URL%",
        "description": "Turn any address into a 3D miniature of the surrounding city, with the real terrain underneath. Download a poster or a watertight STL file for 3D printing.",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires a browser with WebGL 2",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "image": "%SITE_URL%og.jpg",
        "screenshot": "%SITE_URL%og.jpg",
        "featureList": [
          "3D model of any square from 300 m to 4 km around an address",
          "Real terrain with adjustable exaggeration and contour lines",
          "Buildings at their mapped height",
          "Pin a house and share a link to it",
          "Poster image download",
          "Watertight STL file for 3D printing"
        ],
        "license": "https://opensource.org/licenses/MIT",
        "codeRepository": "https://github.com/yourplace3d/3d-city",
        "author": { "@type": "Organization", "name": "Your Place", "url": "https://github.com/yourplace3d" }
      }
    </script>
  </head>
  <body data-app="place">
    <!-- app-body -->
  </body>
</html>
