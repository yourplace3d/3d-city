    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Your Place" />

    <meta property="og:description" content="Open data about a city on a 3D model: steep streets, traffic, trams and buses by the timetable, rents and incomes. Free, in your browser." />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Your Place · Data",
        "url": "%SITE_URL%data/",
        "description": "Open data on a 3D model of any place: steepness of roads and paths, hourly traffic counts in Hamburg, public transport moving by your city’s timetable (GTFS), rents, home values and incomes per area from open data, and your own run, ride or race route with its height profile.",
        "applicationCategory": "ReferenceApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires a browser with WebGL 2",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "image": "%SITE_URL%og.jpg",
        "featureList": [
          "Roads and paths coloured by steepness, anywhere",
          "Hourly traffic counts in Hamburg as streets that rise with the traffic",
          "Public transport moving by your city’s timetable (GTFS)",
          "Buildings coloured by rents, home values or incomes per area, from open data",
          "Your route from a GPX or TCX file, with its height profile",
          "Files read on your device only"
        ],
        "isPartOf": { "@type": "WebApplication", "name": "Your Place", "url": "%SITE_URL%" },
        "license": "https://opensource.org/licenses/MIT",
        "codeRepository": "https://github.com/yourplace3d/3d-city",
        "author": { "@type": "Organization", "name": "Your Place", "url": "https://github.com/yourplace3d" }
      }
